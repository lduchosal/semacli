interactions:
- request:
    body: null
    headers:
      Accept:
      - application/json
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
      User-Agent:
      - python-requests/2.34.2
    method: GET
    uri: https://semaphore.domain.com/api/ping
  response:
    body:
      string: pong
    headers:
      Connection:
      - keep-alive
      Content-Length:
      - '4'
      Content-Security-Policy:
      - default-src 'self' 'unsafe-inline'
      Content-Security-Policy-Report-Only:
      - default-src 'self' 'unsafe-inline' 'unsafe-eval'
      Content-Type:
      - text/plain; charset=utf-8
      Date:
      - Fri, 05 Jun 2026 06:10:30 GMT
      Permissions-Policy:
      - geolocation=(), microphone=(), fullscreen=()
      Referrer-Policy:
      - no-referrer
      Server:
      - nginx
      Strict-Transport-Security:
      - max-age=31536000; includeSubDomains; preload
      X-Content-Type-Options:
      - nosniff
      X-Frame-Options:
      - SAMEORIGIN
    status:
      code: 200
      message: OK
version: 1
