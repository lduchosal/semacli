[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "semacli"
dynamic = ["version"]
authors = [
    {name = "lduchosal", email = "lduchosal@github.com"},
]
description = "A CLI tool to manage Semaphore UI (ansible-semaphore) via HTTP REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
keywords = ["semaphore", "ansible", "cli", "api", "devops"]
dependencies = [
    "click>=8.0,<9.0",
    "pydantic>=2.0,<3.0",
    "certifi>=2024.0",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
    "truststore>=0.9,<1.0",
]

[project.urls]
Homepage = "https://github.com/lduchosal/semacli"
"Bug Reports" = "https://github.com/lduchosal/semacli/issues"
Source = "https://github.com/lduchosal/semacli"
Documentation = "https://github.com/lduchosal/semacli/blob/main/README.md"

[project.scripts]
sem = "semacli.cli:main"
semacli = "semacli.cli:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.pdm-bump]
version-files = [
    "semacli/__init__.py:__version__",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Quality-gate locks (ken #828, ratchet principle of doc/code-quality.md):
# each debt family that reaches zero in semacli/ is added here so the
# acquis becomes a lint error, and removed from DEBT_SELECT in
# scripts/quality_metrics.py. Locked at palier 1: DTZ, G, SLF, PLC0415.
# Locked at palier 2 (ken #829): ARG, PERF, PTH, RUF.
# Locked at palier 3 (ken #831): BLE, EM, FBT, TRY — and RUF100 lifted
# (every remaining argued noqa now references an enabled rule).
# Locked at palier 5 (ken #833): ANN401 (bare Any only at JSON boundaries,
# argued noqas) and the full PLR family (PLR0913 argued per click callback /
# API wrapper). The ken #800 per-file-ignores are fully lifted.
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "C90",
    "DTZ", "G", "SLF", "PLC0415",
    "ARG", "PERF", "PTH", "RUF",
    "BLE", "EM", "FBT", "TRY",
    "ANN401", "PLR",
]
# E501: black owns line length.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from the src-hygiene families (same as kenboard): private
# access and lazy imports are legitimate test idioms. The metrics gate
# (ken #828) only measures semacli/.
"tests/**" = ["DTZ", "G", "SLF", "PLC0415", "ARG", "PERF", "PTH", "RUF", "BLE", "EM", "FBT", "TRY", "ANN401", "PLR"]
# Ratchet (ken #800): existing debt only — new files get the full gate.
# cli: zeroed at palier 5 (ken #833) — PLR0913 on click callbacks is now
# suppressed line-by-line with argued noqas, no file-level ignore left.
# core: zeroed at palier 5 (ken #833) — PLR0913 on API-wrapper signatures
# is suppressed line-by-line with argued noqas; C901 reached zero everywhere.

[tool.importlinter]
root_package = "semacli"

[[tool.importlinter.contracts]]
name = "cli imports core, never the reverse"
type = "layers"
layers = ["semacli.cli", "semacli.core"]

[[tool.importlinter.contracts]]
name = "command modules stay independent of each other"
type = "independence"
modules = [
    "semacli.cli.commands.environments",
    "semacli.cli.commands.info",
    "semacli.cli.commands.init",
    "semacli.cli.commands.integrations",
    "semacli.cli.commands.inventories",
    "semacli.cli.commands.keys",
    "semacli.cli.commands.ping",
    "semacli.cli.commands.projects",
    "semacli.cli.commands.repositories",
    "semacli.cli.commands.run",
    "semacli.cli.commands.schedules",
    "semacli.cli.commands.self_update",
    "semacli.cli.commands.tasks",
    "semacli.cli.commands.templates",
    "semacli.cli.commands.user",
    "semacli.cli.commands.views",
]

[tool.vulture]
# Quality gate (ken #828): dead-code findings are blocking at every palier.
min_confidence = 80
paths = ["semacli", "tests", "vulture_whitelist.py"]

[tool.interrogate]
# Current palier of the quality gate (ken #828) — tightened at each palier,
# never relaxed without a traced human decision (doc/code-quality.md).
fail-under = 95
ignore-init-method = true
ignore-init-module = true
exclude = ["tests", "docs", "build", "dist"]
generate-badge = "."
badge-format = "svg"

[tool.pdm]
distribution = true
version = {source = "file", path = "semacli/__init__.py"}

[tool.pdm.dev-dependencies]
publish = [
    "twine>=6.2.0",
    "keyring>=25.7.0",
]

[tool.pdm.scripts]
format = "ruff format"
typecheck = "mypy semacli/"
build = "python -m build"
install = "pdm install"
install-dev = "pdm install -G dev"
clihelp = "semacli --help"
cli = {composite = ["clihelp"]}
all = {composite = ["install", "format", "build", "test", "cli"]}
test = "env PYTHONPATH=src python -m pytest tests/ -v --cov=semacli --cov-report=term-missing"
test-quick = "env PYTHONPATH=src python -m pytest tests/ --tb=no -q"
test-unit = "env PYTHONPATH=src python -m pytest tests/unit/ -v"
test-unit-quick = "env PYTHONPATH=src python -m pytest tests/unit/ --tb=no -q"
test-integration = "env PYTHONPATH=src python -m pytest tests/integration/ --vcr-record=none -v"
test-integration-record = "env PYTHONPATH=src python -m pytest tests/integration/ -v"
test-cov = "env PYTHONPATH=src python -m pytest tests/ -v --cov=semacli --cov-report=html --cov-report=term-missing"
lint = "ruff check semacli/ tests/"
arch = "lint-imports"
lint-fix = "ruff check --fix semacli/ tests/"
format-check = "black --check semacli/ tests/"
interrogate = "interrogate semacli/"
vulture = "vulture"
refurb = "refurb semacli/"
# Quality metrics snapshot & blocking gate (ken #828) — see doc/code-quality.md
metrics = "python scripts/quality_metrics.py"
metrics-record = "python scripts/quality_metrics.py --record"
metrics-gate = "python scripts/quality_metrics.py --gate"
test-cov-xml = "env PYTHONPATH=src python -m pytest tests/ --cov=semacli --cov-report=xml --cov-report=term --cov-fail-under=80"
check = {composite = ["lint", "format-check", "typecheck", "arch", "vulture", "refurb", "test", "metrics-gate"]}
clean = "rm -rf .coverage htmlcov/ .pytest_cache/ __pycache__/ semacli/__pycache__/"
version-patch = "pdm bump patch"
version-minor = "pdm bump minor"
version-major = "pdm bump major"


[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "mypy>=0.800",
    "ruff>=0.1.0",
    "pdm>=2.0.0",
    "pdm-bump",
    "interrogate>=1.7.0",
    "vcrpy>=8.1.1",
    "pytest-vcr>=1.0.2",
    "import-linter>=2.11",
    "vulture>=2.14",
    "refurb>=2.2.0",
]
