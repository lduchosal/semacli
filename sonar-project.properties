sonar.projectKey=lduchosal_semacli
sonar.organization=lduchosal

# vscode/: the VS Code extension (ken #1131), JS analysed with the lcov the
# CI `vscode` job produces (node --test --experimental-test-coverage).
sonar.sources=semacli,vscode/src
sonar.tests=tests,vscode/test

sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=vscode/lcov.info

sonar.exclusions=dist/**,vscode/node_modules/**,build/**,**/__pycache__/**,interrogate_badge.svg,doc/**
sonar.coverage.exclusions=tests/**,vscode/test/**

# Scoped suppression: client.py's _build_insecure_ssl_context() deliberately
# disables hostname + cert verification — only reached when the user sets
# verify_ssl=false in their config. The default is secure (verify_ssl=true).
# See ken #638.
# e4: same opt-in insecure mode in the VS Code extension (ken #1131):
# vscode/src/api.js sets rejectUnauthorized=false only when semacli.ini has
# verify_ssl=false; the default verifies certificates.
# e3: S107 (max params) on the cli commands — click callbacks carry one
# parameter per --option by design (same rationale as the argued PLR0913
# noqas, quality gate ken #833/#835). The ruff gate keeps the real ceiling.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=semacli/core/client.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S4423
sonar.issue.ignore.multicriteria.e2.resourceKey=semacli/core/client.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=semacli/cli/commands/*.py
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S4830
sonar.issue.ignore.multicriteria.e4.resourceKey=vscode/src/api.js
